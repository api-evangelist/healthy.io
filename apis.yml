  detail: >-
    Healthy.io runs a documentation host and a status host, but both docs.healthy.io and
    status.healthy.io 302-redirect every path to a healthyio.cloudflareaccess.com SSO login,
    so the EMR/SMART-on-FHIR integration surface the homepage advertises cannot be read,
    parsed or evaluated by anyone without a Healthy.io identity.
