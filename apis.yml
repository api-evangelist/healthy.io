aid: healthy.io
name: Healthy.io
description: >-
  Healthy.io is a digital-health company that turns an ordinary smartphone camera into a
  clinical-grade measurement device, using colorimetric analysis, computer vision and machine
  learning trained on more than a million tagged color-spectrum images. Its Minuteful product
  line covers home urinalysis for chronic kidney disease (Minuteful Kidney, FDA 510(k) cleared
  and CE marked), urinary tract infection testing (Minuteful UTI), a ten-parameter urinalysis
  panel (Minuteful 10), and digitized chronic wound assessment (Minuteful for Wound). The
  company sells to health systems, provider groups and payers - including Medicare Advantage
  and nonprofit health plans - rather than to developers, and states that its technology
  integrates into most EMRs via SMART on FHIR. Healthy.io operates from Boston, London and
  Tel Aviv, and publishes a detailed public trust center covering security, privacy,
  availability and compliance, including a coordinated vulnerability disclosure policy.
